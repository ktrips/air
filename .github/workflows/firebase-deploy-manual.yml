name: Manual Deploy to Firebase

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create firebase-config.js from Secret
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          cat > firebase-config.js << EOF
          /*
           * Firebase 設定
           * firebase-config.js はGitHub Secretsから自動生成されます
           */
          const FIREBASE_CONFIG = $FIREBASE_CONFIG_JSON;
          window.FIREBASE_CONFIG = FIREBASE_CONFIG;
          EOF
          echo "Generated firebase-config.js:"
          cat firebase-config.js

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GCLOUD_PROJECT: airgo-trip
          GOOGLE_CLOUD_PROJECT: airgo-trip
        run: |
          firebase deploy --only hosting,firestore:rules,storage --project airgo-trip --token "$(gcloud auth print-access-token)"
